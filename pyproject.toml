[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "robotomail"
version = "0.2.0"
description = "Official Robotomail SDK for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Robotomail", email = "support@robotomail.com"}]
dependencies = ["httpx>=0.27,<1", "typing-extensions>=4.9,<5"]

[project.urls]
Homepage = "https://robotomail.com"
Repository = "https://github.com/robotomail/robotomail-python"
Documentation = "https://robotomail.com/docs"

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8,<10", "mypy>=1.14,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/robotomail"]

[tool.hatch.build.targets.sdist]
include = ["src", "test", "examples", "scripts", "openapi.json", "sdk.json", "contract.json", "README.md", "API.md", "LICENSE", "pyproject.toml"]
