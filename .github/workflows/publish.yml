name: Publish package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching the package version, e.g. v0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: package-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: package-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3.12 scripts/check_release.py
      - run: python3.12 scripts/generate.py --check
      - name: Test and build
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
          python -m mypy --check-untyped-defs src/robotomail
          python -m build
      - name: Publish Python package
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          test -n "$TWINE_PASSWORD"
          python -m pip install 'twine>=6,<7'
          python -m twine check dist/*
          python -m twine upload --non-interactive dist/*
